# CI de OceanEyes (HU-057): lint, tipos, pruebas unitarias, reglas con emulador, contrato,
# Cloud Functions y build web. No despliega nada ni usa credenciales reales.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (src)
        run: npx eslint src
      # expo-env.d.ts (tipos de expo/types, p. ej. react-native-web) está en .gitignore; Expo
      # indica generarlo en CI con este comando antes de tsc.
      - name: Generar expo-env.d.ts
        run: npx expo customize tsconfig.json
      - name: TypeScript
        run: npx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Jest (src/**/__tests__ + __tests__/unit)
        run: npm test -- --coverage --coverageReporters=text-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm ci
        working-directory: __tests__
      - name: Reglas Firestore/Storage en emulador (demo-oceaneyes)
        run: firebase emulators:exec --only firestore,storage --project demo-oceaneyes "npm --prefix __tests__ run test:rules:raw"

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx hardhat test
      - run: npx hardhat coverage

  functions-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  web-build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web && node scripts/fix-assets.cjs
        env:
          EXPO_PUBLIC_POINT_LEDGER_ADDRESS: '0xbA7A9d6cB7581Ef28cD01c77813bA229Cb2B1509'
      - name: Empaquetado del Worker (sin desplegar)
        run: npx wrangler deploy --dry-run --outdir worker-dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
