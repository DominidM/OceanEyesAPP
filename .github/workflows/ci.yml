# Propuesta de CI para OceanEyes — DESACTIVADA.
# Solo se dispara manualmente (workflow_dispatch). Para activarla en cada push/PR,
# agregar:
#   push:
#     branches: [main, developer]
#   pull_request:
name: CI (propuesta)

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npx eslint . --ignore-pattern "public/**" --ignore-pattern "__tests__/node_modules/**"
      - name: TypeScript
        run: npx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-audit --no-fund
        working-directory: __tests__
      - run: npx jest --selectProjects unit --coverage
        working-directory: __tests__

  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm install --no-audit --no-fund
        working-directory: __tests__
      - run: firebase emulators:exec --only firestore,storage --project demo-oceaneyes "npm --prefix __tests__ run test:rules:raw"

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json de /contracts está desincronizado (npm ci falla); usar npm ci tras regenerarlo.
      - run: npm install --no-audit --no-fund
      - run: npx hardhat test
      - run: npx hardhat coverage

  functions-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  web-build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web && node scripts/fix-assets.cjs
        env:
          EXPO_PUBLIC_POINT_LEDGER_ADDRESS: '0xbA7A9d6cB7581Ef28cD01c77813bA229Cb2B1509'
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
